workflows:
  android-release:
    name: Mahadev Player APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - flutter pub get
      - flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk