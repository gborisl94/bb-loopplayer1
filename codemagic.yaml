workflows:
  bb-loop-player:
    name: BB Loop Player Android
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Générer le squelette Android
        script: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --platforms=android --org com.bb --project-name bb_loop_player
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf test
      - name: Patch Gradle (compileSdk 34, ndk 26.3, gradle 8.5) et manifeste
        script: |
          python3 - <<'PY'
          import os, re

          def rd(p):
              return open(p, encoding='utf-8').read()

          def wr(p, s):
              open(p, 'w', encoding='utf-8').write(s)

          # Gradle 8.5
          p = 'android/gradle/wrapper/gradle-wrapper.properties'
          s = rd(p)
          s = re.sub(r'distributionUrl=.*',
                     r'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-all.zip', s)
          wr(p, s)

          # Plugins AGP / Kotlin compatibles Gradle 8.5
          for p in ('android/settings.gradle', 'android/settings.gradle.kts'):
              if os.path.exists(p):
                  s = rd(p)
                  s = re.sub(r'("com\.android\.application"\)?\s*version\s*")[^"]+', r'\g<1>8.3.0', s)
                  s = re.sub(r'("org\.jetbrains\.kotlin\.android"\)?\s*version\s*")[^"]+', r'\g<1>1.9.24', s)
                  wr(p, s)

          # Anciens gabarits (buildscript)
          p = 'android/build.gradle'
          if os.path.exists(p):
              s = rd(p)
              s = re.sub(r"(ext\.kotlin_version\s*=\s*')[^']+", r'\g<1>1.9.24', s)
              s = re.sub(r'(com\.android\.tools\.build:gradle:)[\d.]+', r'\g<1>8.3.0', s)
              wr(p, s)

          # Module app : SDK / NDK
          for p in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              if os.path.exists(p):
                  s = rd(p)
                  s = re.sub(r'compileSdk(?:Version)?\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 34', s)
                  s = re.sub(r'ndkVersion\s*=?\s*flutter\.ndkVersion', 'ndkVersion = "26.3.11579264"', s)
                  s = re.sub(r'minSdk(?:Version)?\s*=?\s*flutter\.minSdkVersion', 'minSdk = 24', s)
                  s = re.sub(r'targetSdk(?:Version)?\s*=?\s*flutter\.targetSdkVersion', 'targetSdk = 34', s)
                  wr(p, s)

          # Manifeste : permissions audio / stockage
          p = 'android/app/src/main/AndroidManifest.xml'
          s = rd(p)
          perms = (
              '<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n'
              '    '
          )
          s = s.replace('<application',
                        perms + '<application android:requestLegacyExternalStorage="true"', 1)
          wr(p, s)
          PY
          grep -rn "compileSdk\|ndkVersion\|minSdk\|targetSdk" android/app/build.gradle* || true
          cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Dépendances
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk